name: OCR static regression checks

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ocr-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check OCR and service-worker syntax
        run: |
          node --check ocr.js
          node --check sw.js
      - name: Run OCR static regression tests
        run: node --test tests/ocr-regression.test.mjs
