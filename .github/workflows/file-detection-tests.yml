name: Browser utility tests

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'file-detection.js'
      - 'image-to-pdf.js'
      - 'docx-to-pdf.js'
      - 'pdf-to-images.js'
      - 'tests/**'
      - '.github/workflows/file-detection-tests.yml'
  pull_request:
    paths:
      - 'file-detection.js'
      - 'image-to-pdf.js'
      - 'docx-to-pdf.js'
      - 'pdf-to-images.js'
      - 'tests/**'
      - '.github/workflows/file-detection-tests.yml'

jobs:
  browser-utility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run browser utility unit tests
        run: node --experimental-default-type=module --test tests/*.test.mjs
